name: hoshino-blog

services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hoshino_blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blogpass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-u${MYSQL_USER:-blog}',
          '-p${MYSQL_PASSWORD:-blogpass}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-docker-dev-change-me}
      DEBUG: 'False'
      USE_MYSQL: 'True'
      USE_X_FORWARDED_HOST: 'True'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hoshino_blog}
      MYSQL_USER: ${MYSQL_USER:-blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blogpass}
      MYSQL_HOST: db
      MYSQL_PORT: '3306'
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      RUN_SEED: ${RUN_SEED:-1}
      SITE_AUTHOR_USERNAME: ${SITE_AUTHOR_USERNAME:-}
      SITE_AUTHOR_EMAIL: ${SITE_AUTHOR_EMAIL:-}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/schema/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  media_data:
  static_data:
